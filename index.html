<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloom AI ✨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');

:root {
    --pink: #f7b8d5;
    --purple: #c7a6f7;
    --dark: #654b78;
    --muted: #a28eae;
    --white: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    color: var(--dark);
    background: #fff9fd;
}

/* Sidebar */

.sidebar {
    width: 255px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 23px 16px;
    gap: 13px;
    background: linear-gradient(180deg, #f7eaff, #ffeaf4);
    border-right: 1px solid #f0dff4;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 25px;
    font-weight: 800;
    color: #a56cc8;
    margin: 0 5px 23px;
}

.brand-icon {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    color: white;
    background: linear-gradient(135deg, #c7a6f7, #f5a9d0);
    box-shadow: 0 5px 14px #d8a7eb55;
}

.side-button {
    padding: 13px;
    border: 1px solid transparent;
    border-radius: 15px;
    background: transparent;
    color: #80668f;
    font: inherit;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
}

.side-button:hover {
    background: #ffffffb8;
    border-color: #eed8f2;
}

.side-button.active {
    background: white;
    box-shadow: 0 4px 14px #cfa9e91c;
    color: #a46bc5;
}

.side-heading {
    margin: 20px 9px 4px;
    color: #b39bc0;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow-y: auto;
}

.history-item {
    border: none;
    background: transparent;
    padding: 11px;
    color: #947ca1;
    font: inherit;
    font-size: 13px;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-radius: 11px;
    cursor: pointer;
}

.history-item:hover {
    background: #ffffffa8;
}

.profile {
    margin-top: auto;
    padding: 14px 5px 2px;
    border-top: 1px solid #ead8f0;
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 37px;
    height: 37px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #c7a6f7, #f7b8d5);
    color: white;
    font-weight: 800;
}

.profile-name {
    font-weight: 800;
    font-size: 14px;
}

.profile-small {
    color: #b09abb;
    font-size: 11px;
}

/* Main area */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
        radial-gradient(ellipse at 50% 0%, #f9eafa 0%, transparent 47%),
        #fffafd;
}

.topbar {
    min-height: 68px;
    padding: 17px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f4e8f3;
    background: #ffffff6b;
}

.top-title {
    font-size: 15px;
    font-weight: 800;
}

.top-subtitle {
    font-size: 11px;
    color: #b09abb;
    margin-top: 2px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #987aa6;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #88d6aa;
    box-shadow: 0 0 9px #88d6aa77;
}

/* Messages */

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 24px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 700px;
    margin: 8vh auto 30px;
    text-align: center;
    animation: appear 0.7s ease;
}

.hero-icon {
    position: relative;
    width: 86px;
    height: 86px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
    border-radius: 30px;
    font-size: 42px;
    background: linear-gradient(135deg, #f7d8ed, #e6d9ff);
    box-shadow: 0 12px 30px #dcb7e82b;
    animation: float 3s ease-in-out infinite;
}

.hero-icon::after {
    content: "✦";
    position: absolute;
    top: -12px;
    right: -13px;
    color: #e6a9cf;
    font-size: 24px;
}

.welcome h1 {
    font-size: clamp(27px, 4vw, 40px);
    line-height: 1.2;
    font-weight: 800;
    color: #9e6fc0;
    margin-bottom: 13px;
}

.welcome h1 span {
    background: linear-gradient(90deg, #b68ae8, #ed9bc5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.welcome p {
    color: #aa95b3;
    font-size: 16px;
}

/* Suggestion cards */

.suggestions {
    width: min(680px, 100%);
    margin: 0 auto 25px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 13px;
    animation: appear 0.8s ease;
}

.suggestion {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px;
    text-align: left;
    border: 1px solid #f0e1f2;
    background: #ffffffd9;
    border-radius: 19px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.22s;
    box-shadow: 0 5px 17px #d9b8e51a;
}

.suggestion:hover {
    transform: translateY(-3px);
    border-color: #d9b9ef;
    box-shadow: 0 9px 22px #d9b8e533;
}

.suggestion-icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    font-size: 20px;
    border-radius: 14px;
    background: #f6e9ff;
}

.suggestion:nth-child(2) .suggestion-icon {
    background: #ffedf5;
}

.suggestion:nth-child(3) .suggestion-icon {
    background: #e9f8f1;
}

.suggestion:nth-child(4) .suggestion-icon {
    background: #fff3df;
}

.suggestion-title {
    color: #745b83;
    font-size: 13px;
    font-weight: 800;
}

.suggestion-desc {
    color: #b09db8;
    font-size: 11px;
    margin-top: 3px;
}

/* Chat bubbles */

.message {
    width: fit-content;
    max-width: min(720px, 90%);
    margin: 19px auto;
    padding: 14px 18px;
    border-radius: 19px;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    animation: appear 0.25s ease;
}

.message.user {
    margin-right: max(0px, calc((100% - 720px) / 2));
    margin-left: auto;
    background: linear-gradient(135deg, #eadcff, #ffe3f0);
    border: 1px solid #e9d7f4;
    border-bottom-right-radius: 5px;
}

.message.bot {
    margin-left: max(0px, calc((100% - 720px) / 2));
    margin-right: auto;
    background: white;
    border: 1px solid #f0e3f3;
    border-bottom-left-radius: 5px;
    box-shadow: 0 4px 14px #cfa9e91a;
}

.bot-label {
    font-size: 11px;
    color: #b184cc;
    font-weight: 800;
    margin-bottom: 5px;
}

/* Composer */

.composer-wrap {
    padding: 8px 20px 8px;
    background: linear-gradient(transparent, #fffafd 30%);
}

.composer {
    width: min(750px, 100%);
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 11px 10px 17px;
    background: white;
    border: 1px solid #ead9ef;
    border-radius: 23px;
    box-shadow: 0 8px 28px #d8b3e51f;
    transition: 0.2s;
}

.composer:focus-within {
    border-color: #d3b0ed;
    box-shadow: 0 0 0 4px #f2e5fb, 0 8px 28px #d8b3e51f;
}

.composer textarea {
    flex: 1;
    min-width: 0;
    max-height: 140px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #654b78;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    padding: 9px 0;
}

.composer textarea::placeholder {
    color: #b8a7c0;
}

.send {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #c4a0f5, #efabd0);
    color: white;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px #d3a5e333;
    transition: 0.2s;
}

.send:hover {
    transform: scale(1.07);
}

.send:disabled {
    opacity: 0.5;
    cursor: wait;
}

.disclaimer {
    text-align: center;
    padding: 10px 5px 13px;
    color: #b7a7bf;
    font-size: 10px;
}

.empty {
    text-align: center;
    color: #aa95b3;
    margin: 20px;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Mobile */

@media (max-width: 650px) {
    .sidebar {
        width: 67px;
        padding: 17px 7px;
        align-items: center;
    }

    .brand {
        margin: 0 0 17px;
        font-size: 0;
    }

    .brand-icon {
        width: 42px;
        height: 42px;
        font-size: 22px;
    }

    .side-button {
        width: 49px;
        padding: 12px 4px;
        text-align: center;
        font-size: 12px;
    }

    .sidebar .label,
    .sidebar .side-heading,
    .sidebar .history,
    .profile-details {
        display: none;
    }

    .profile {
        justify-content: center;
        width: 100%;
    }

    .avatar {
        width: 36px;
        height: 36px;
    }

    .topbar {
        padding: 15px;
    }

    .messages {
        padding: 14px 12px;
    }

    .welcome {
        margin-top: 7vh;
    }

    .hero-icon {
        width: 70px;
        height: 70px;
        font-size: 34px;
        border-radius: 25px;
    }

    .welcome p {
        font-size: 14px;
    }

    .suggestions {
        grid-template-columns: 1fr;
        gap: 9px;
    }

    .suggestion {
        padding: 12px;
    }

    .composer-wrap {
        padding: 7px 10px;
    }

    .message {
        max-width: 95%;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="brand">
        <span class="brand-icon">✿</span>
        Bloom AI
    </div>

    <button class="side-button active" onclick="newChat()">
        ✚ <span class="label"> &nbsp; New chat</span>
    </button>

    <button class="side-button" onclick="focusInput()">
        ⌕ <span class="label"> &nbsp; Ask a question</span>
    </button>

    <div class="side-heading">RECENT CHATS</div>
    <div class="history" id="history">
        <div class="empty" style="font-size:12px">Your chats will appear here ♡</div>
    </div>

    <div class="profile">
        <div class="avatar">M</div>
        <div class="profile-details">
            <div class="profile-name">Monisha ♡</div>
            <div class="profile-small">Your little AI corner</div>
        </div>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <div>
            <div class="top-title">Your cozy space ☁️</div>
            <div class="top-subtitle">A little help, whenever you need it</div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Ready to chat
        </div>
    </header>

    <section class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="hero-icon">🌷</div>
            <h1>Hello, <span>Monisha!</span></h1>
            <p>What shall we learn today? ✨</p>
        </div>

        <div class="suggestions" id="suggestions">
            <button class="suggestion"
                onclick="ask('Explain HTML in simple words')">
                <span class="suggestion-icon">📚</span>
                <span>
                    <div class="suggestion-title">Explain a concept</div>
                    <div class="suggestion-desc">Make learning easy ♡</div>
                </span>
            </button>

            <button class="suggestion"
                onclick="ask('Help me write a website using HTML and CSS')">
                <span class="suggestion-icon">🎀</span>
                <span>
                    <div class="suggestion-title">Create a website</div>
                    <div class="suggestion-desc">Let's build something cute</div>
                </span>
            </button>

            <button class="suggestion"
                onclick="ask('Teach me JavaScript basics')">
                <span class="suggestion-icon">💻</span>
                <span>
                    <div class="suggestion-title">Learn coding</div>
                    <div class="suggestion-desc">Step by step, no stress</div>
                </span>
            </button>

            <button class="suggestion"
                onclick="ask('Help me make a study plan')">
                <span class="suggestion-icon">🌸</span>
                <span>
                    <div class="suggestion-title">Study with me</div>
                    <div class="suggestion-desc">One little step at a time</div>
                </span>
            </button>
        </div>
    </section>

    <div class="composer-wrap">
        <form class="composer" id="chatForm">
            <textarea
                id="prompt"
                rows="1"
                placeholder="Ask me anything, Monisha... ♡"
                aria-label="Your message"></textarea>

            <button class="send" id="send" type="submit"
                aria-label="Send message">➤</button>
        </form>

        <div class="disclaimer">
            Made with ♡ for curious minds · Demo mode
        </div>
    </div>
</main>

<script>
const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const form = document.getElementById("chatForm");
const sendButton = document.getElementById("send");
const historyBox = document.getElementById("history");

let conversations = [];
let currentConversation = [];
let busy = false;

function focusInput() {
    promptBox.focus();
}

function addMessage(text, type) {
    const bubble = document.createElement("div");
    bubble.className = "message " + type;

    if (type === "bot") {
        const label = document.createElement("div");
        label.className = "bot-label";
        label.textContent = "✿ Bloom AI";
        bubble.appendChild(label);
    }

    const content = document.createElement("div");
    content.textContent = text;
    bubble.appendChild(content);

    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;

    return content;
}

function getDemoAnswer(text) {
    const q = text.toLowerCase();

    if (q.includes("html")) {
        return "Of course! 🌷\n\nHTML stands for HyperText Markup Language. It creates the structure of a webpage.\n\nFor example:\n\n<h1>Hello World</h1>\n<p>This is my first webpage.</p>\n\nThe h1 tag creates a heading, and the p tag creates a paragraph. You're doing great! ♡";
    }

    if (q.includes("css") || q.includes("website")) {
        return "Let's make something lovely! 🎀\n\nCSS is used to style your website. You can change colors, fonts, spacing, backgrounds and layouts.\n\nExample:\n\nbody {\n  background: pink;\n  font-family: Arial;\n}\n\nSave your file and refresh your browser to see your changes. ✨";
    }

    if (q.includes("javascript") || q.includes("coding") || q.includes("code")) {
        return "Let's learn coding one step at a time! 💻\n\nJavaScript makes a website interactive.\n\nExample:\n\nlet name = 'Monisha';\nconsole.log('Hello ' + name);\n\nThis prints Hello Monisha in the console. Keep practising! 🌸";
    }

    if (q.includes("study") || q.includes("exam")) {
        return "We can do this, one step at a time! 🌷\n\n1. Pick one topic.\n2. Understand the basic concept.\n3. Write short notes.\n4. Practise a few questions.\n5. Revise what you learned.\n\nRemember: small steps count. ♡";
    }

    if (q.includes("hello") || q.includes("hi ") || q === "hi") {
        return "Hiii! 🌸 Welcome to your cozy little chat space. What would you like to learn or create today? ♡";
    }

    return "Thank you for your question! ♡\n\nI'm currently running in demo mode, so my replies are simple predefined examples, not real AI-generated answers.\n\nTo answer any question intelligently like ChatGPT, this website needs a secure AI backend. We can connect one next! ✨";
}

function saveHistory(title) {
    if (!currentConversation.length) return;

    conversations.unshift({
        title: title.slice(0, 35),
        messages: [...currentConversation]
    });

    if (conversations.length > 10) conversations.pop();

    historyBox.innerHTML = "";

    conversations.forEach((conversation, index) => {
        const button = document.createElement("button");
        button.className = "history-item";
        button.textContent = "♡ " + conversation.title;
        button.title = conversation.title;

        button.onclick = () => loadConversation(index);

        historyBox.appendChild(button);
    });
}

function loadConversation(index) {
    const conversation = conversations[index];
    if (!conversation) return;

    currentConversation = [...conversation.messages];
    renderConversation();
}

function renderConversation() {
    messages.innerHTML = "";

    currentConversation.forEach(message => {
        addMessage(message.text, message.type);
    });
}

function newChat() {
    if (currentConversation.length) {
        saveHistory(currentConversation[0].text);
    }

    currentConversation = [];

    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="hero-icon">🌷</div>
            <h1>Hello, <span>Monisha!</span></h1>
            <p>What shall we learn today? ✨</p>
        </div>

        <div class="suggestions" id="suggestions">
            <button class="suggestion" onclick="ask('Explain HTML in simple words')">
                <span class="suggestion-icon">📚</span>
                <span><div class="suggestion-title">Explain a concept</div>
                <div class="suggestion-desc">Make learning easy ♡</div></span>
            </button>

            <button class="suggestion" onclick="ask('Help me write a website using HTML and CSS')">
                <span class="suggestion-icon">🎀</span>
                <span><div class="suggestion-title">Create a website</div>
                <div class="suggestion-desc">Let's build something cute</div></span>
            </button>

            <button class="suggestion" onclick="ask('Teach me JavaScript basics')">
                <span class="suggestion-icon">💻</span>
                <span><div class="suggestion-title">Learn coding</div>
                <div class="suggestion-desc">Step by step, no stress</div></span>
            </button>

            <button class="suggestion" onclick="ask('Help me make a study plan')">
                <span class="suggestion-icon">🌸</span>
                <span><div class="suggestion-title">Study with me</div>
                <div class="suggestion-desc">One little step at a time</div></span>
            </button>
        </div>`;

    promptBox.value = "";
    promptBox.focus();
}

function ask(text) {
    promptBox.value = text;
    sendMessage();
}

async function sendMessage() {
    const text = promptBox.value.trim();

    if (!text || busy) return;

    busy = true;
    sendButton.disabled = true;

    document.getElementById("welcome")?.remove();
    document.getElementById("suggestions")?.remove();

    currentConversation.push({ text, type: "user" });
    addMessage(text, "user");

    promptBox.value = "";
    promptBox.style.height = "auto";

    const replyElement = addMessage("Thinking of something helpful... ✨", "bot");

    // Demo response only; no API key is used in this file.
    await new Promise(resolve => setTimeout(resolve, 650));

    const answer = getDemoAnswer(text);
    replyElement.textContent = answer;

    currentConversation.push({ text: answer, type: "bot" });

    messages.scrollTop = messages.scrollHeight;
    busy = false;
    sendButton.disabled = false;
    promptBox.focus();
}

form.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage();
});

promptBox.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

promptBox.addEventListener("input", () => {
    promptBox.style.height = "auto";
    promptBox.style.height =
        Math.min(promptBox.scrollHeight, 140) + "px";
});
</script>

</body>
</html>
